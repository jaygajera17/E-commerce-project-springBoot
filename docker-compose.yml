services:
  mysql:
    image: mysql:8.0
    container_name: ecomm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ecommjava
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Seeds categories/users/products on the first start only (empty volume)
      - ./basedata.sql:/docker-entrypoint-initdb.d/basedata.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecomm-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Spring maps DB_URL -> db.url, DB_USERNAME -> db.username, DB_PASSWORD -> db.password
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_URL: jdbc:mysql://mysql:3306/ecommjava?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

volumes:
  mysql_data:
