# This workflow triages pull requests and applies labels based on changed paths.
# It is resilient when labeler config is missing on the base branch.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Verify labeler config exists
        id: labeler_config
        shell: bash
        run: |
          if [[ -f ".github/labeler.yml" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Labeler config missing::.github/labeler.yml not found on base branch; skipping labeler."
          fi

      - name: Apply labels
        if: steps.labeler_config.outputs.exists == 'true'
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
